  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Gift icon -->
  <g transform="translate(120,205)">
    <rect x="10" y="80" width="170" height="120" rx="12" fill="url(#box)"/>
    <rect x="2" y="56" width="186" height="36" rx="10" fill="#818cf8"/>
